[workspace]
resolver = "2"
members = ["crates/neko-crypto", "crates/neko-vault", "crates/neko-hd", "crates/neko-tron", "crates/neko-evm", "crates/neko-store", "crates/neko-core", "crates/neko-i18n", "crates/neko-tui", "crates/neko-wallet"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.86"
license      = "MIT"
repository   = "https://github.com/zoefix/neko-wallet"

[workspace.dependencies]
# --- crypto primitives (see plan: pinned generations) ---
argon2           = { version = "0.6", default-features = false, features = ["alloc", "zeroize", "parallel"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
hkdf             = "0.12"
sha2             = "0.10"
hmac             = "0.12"
subtle           = "2"
zeroize          = { version = "1.8", features = ["alloc", "derive"] }
getrandom        = "0.2"

# --- hd wallet / tron ---
# bip32 0.5.3 pins k256 0.13 / sha2 0.10 / hmac 0.12; this branch stays there.
bip32 = { version = "0.5.3", default-features = false, features = ["alloc", "secp256k1", "bip39"] }
bip39 = { version = "2.2", default-features = false, features = ["std"] }
k256  = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3  = "0.10"
bs58  = { version = "0.5.1", features = ["check"] }

# --- storage ---
rusqlite = { version = "0.40", default-features = false, features = ["column_decltype", "i128_blob"] }

unicode-normalization = "0.1"

# --- tui ---
ratatui   = "0.30"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
unicode-width = "0.2"
unicode-segmentation = "1"

clap = { version = "4", features = ["derive", "env"] }
directories = "6"

# --- http ---
# rustls-tls uses ring, not aws-lc-rs: no CMake or NASM on Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# --- shared ---
thiserror  = "2"
hex        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.9"
