name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The day-0 risk in the plan: SQLCipher must build on all three platforms.
  # Windows/MSVC is the hard one -- vendored OpenSSL is mandatory there and
  # needs Perl + NASM. If this job cannot be made green, the packaging story
  # has to change, so it runs before anything else is built on top.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14 }
          - { name: linux-x86_64,  os: ubuntu-22.04 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Linux links the system libcrypto. macOS needs nothing at all: SQLCipher
      # selects CommonCrypto there and never touches OpenSSL.
      - name: Install OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Windows vendors OpenSSL from source. Strawberry Perl is preinstalled on
      # the runner; NASM is not.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # The debug profile is not what anybody installs. Running the suite once
      # in release on Windows is what turns "probably fine" into a fact.
      - name: Test in release (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --release

      # Proves SQLCipher is genuinely linked. Without this a silent fallback to
      # plain SQLite would leave every "encrypted" vault in plaintext.
      - name: Assert SQLCipher is linked
        run: cargo test -p neko-store --test sqlcipher_contract -- --nocapture

  # A vault created on one platform must open on the others. The crypto
  # providers differ (CommonCrypto vs OpenSSL) even though the on-disk format
  # is supposed to be identical -- so prove it rather than assume it.
  cross-platform-file-format:
    name: cross-platform .db compatibility
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Portability acceptance test
        run: cargo test -p neko-core --test vault_lifecycle -- db_file_is_portable --nocapture

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The install scripts are the first thing a new user runs, and they are the
  # one part of this repository that never gets compiled. Each is at least
  # parsed on the platform it targets.
  installers:
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh install.sh
      - name: Check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "install.ps1 parses"

  # The program must never grow a way to update itself. This is the check that
  # keeps that true: a wallet able to replace its own executable is a wallet
  # with a remote code path into the machine holding the keys, and that is a
  # property worth enforcing rather than remembering.
  offline:
    name: no self-update code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No self-replacement crates in the dependency tree
        run: |
          set -euo pipefail
          tree="$(cargo tree -p neko-wallet -e normal)"
          for crate in self-replace self_update minisign-verify; do
            if printf '%s' "$tree" | grep -q "$crate "; then
              echo "::error::$crate is back in the dependency tree"
              exit 1
            fi
          done
          echo "no self-update crates"
      - name: Every outbound destination is one we have justified
        run: |
          set -euo pipefail
          # The allowlist is the promise the README makes, kept honest by
          # having to be edited deliberately whenever it changes:
          #
          #   trongrid.io, bsc-dataseed,  the chain nodes, all configurable
          #   mainnet-beta.solana.com,
          #   ethereum-rpc.publicnode.com,
          #   polygon-bor-rpc.publicnode.com
          #   blockstream.info          Bitcoin's is an *indexer*, not a node:
          #                             a node cannot say what an address
          #                             holds, so there is no version of this
          #                             that asks nobody
          #   toncenter.com             the same shape as Bitcoin's: reading a
          #                             TON balance means running a contract's
          #                             own method, which needs a full node's
          #                             index behind it. Configurable, and its
          #                             optional key only raises a rate limit
          #   nodereal.io               BNB Chain and Ethereum history, only
          #                             when the user supplies a key; never
          #                             contacted without one
          #   tronscan / bscscan /      explorer links, copied for the user to
          #   solscan / etherscan /     open - this wallet never fetches them
          #   mempool.space / tonviewer
          #   polygonscan
          #   tether.to                 named by TON's USDT as where its own
          #                             metadata lives. Read out of the
          #                             contract and never fetched: the wallet
          #                             checks the decimals, which are on
          #                             chain, and does not go looking for the
          #                             symbol, which is not
          #   my-node / x.example       examples in documentation
          #
          # Notably absent: any price service. Portfolio values are quoted from
          # a swap pool on the chain already being talked to - SunSwap on TRON,
          # PancakeSwap on BNB Chain, Raydium on Solana, Uniswap on Ethereum,
          # QuickSwap on Polygon, DeDust on TON - so showing them costs no new
          # destination. Bitcoin has no exchange on it, so BTC is quoted
          # from the BTCB pool on BNB Chain: still a chain we already talk to,
          # and the interface says the figure is BTCB's. Solana history needs no
          # indexer either: the cluster already records what every account held
          # before and after each transaction.
          found="$(grep -rhoE 'https?://[a-zA-Z0-9._/-]+' crates/*/src \
                   | sort -u \
                   | grep -vE 'trongrid\.io|bsc-dataseed|mainnet-beta\.solana\.com|ethereum-rpc\.publicnode\.com|polygon-bor-rpc\.publicnode\.com|polygonscan\.com|blockstream\.info|nodereal\.io|tronscan\.org|bscscan\.com|solscan\.io|etherscan\.io|mempool\.space|toncenter\.com|tonviewer\.com|tether\.to|my-node\.example|x\.example' || true)"
          if [ -n "$found" ]; then
            echo "::error::unexpected network destinations in the program:"
            printf '%s\n' "$found"
            echo "If this is deliberate, add it here and update the README's claim."
            exit 1
          fi
          echo "only the chain nodes, the optional history indexer, and explorer links"
