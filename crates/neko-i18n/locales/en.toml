# Reference locale. Every other file is checked against this one at build time:
# same keys, same %{placeholders}, no ambiguous-width characters.
#
# Rules:
#   - named interpolation only (%{name}), never positional: translators reorder
#   - one key is one complete sentence; never concatenate translated fragments
#   - ASCII punctuation only: "..." not the ellipsis character, "->" not an arrow

